<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R3DFIELD - Dark Red Stream Overlay</title>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
    --red:#ff1018;
    --red2:#a90008;
    --red3:#4c0004;
    --black:#020203;
    --white:#f1eeee;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010101;
}

body{
    color:var(--white);
    font-family:'Oswald',Arial,sans-serif;
}

.container{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    isolation:isolate;
    background:
        radial-gradient(ellipse at center,rgba(100,0,5,.17),transparent 48%),
        radial-gradient(ellipse at 50% 115%,rgba(255,0,10,.12),transparent 48%),
        linear-gradient(115deg,#020202 0%,#070708 46%,#030303 100%);
}

/* ===== TEXTURA OSCURA ===== */
.container:before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-10;
    opacity:.45;
    background:
        repeating-linear-gradient(110deg,
            rgba(255,255,255,.025) 0px,
            rgba(255,255,255,.025) 2px,
            transparent 2px,
            transparent 8px);
    mix-blend-mode:screen;
}

/* ===== VIGNETTE ===== */
.container:after{
    content:"";
    position:absolute;
    inset:-5%;
    z-index:20;
    pointer-events:none;
    background:
        radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.32) 78%,rgba(0,0,0,.75) 100%);
}

/* ===== LINEAS DIAGONALES PRINCIPALES ===== */
.line-system{
    position:absolute;
    inset:-20%;
    z-index:-7;
    pointer-events:none;
    transform:rotate(-7deg);
}

.neon-line{
    position:absolute;
    height:1px;
    background:linear-gradient(90deg,
        transparent 0%,
        rgba(255,0,12,.15) 10%,
        rgba(255,25,30,.95) 38%,
        rgba(255,60,60,1) 50%,
        rgba(255,0,12,.75) 68%,
        transparent 100%);
    box-shadow:
        0 0 4px rgba(255,0,0,.9),
        0 0 13px rgba(255,0,0,.55),
        0 0 35px rgba(255,0,0,.18);
    transform-origin:left center;
    animation:linePulse 4s ease-in-out infinite;
}

.neon-line:after{
    content:"";
    position:absolute;
    top:-3px;
    left:0;
    width:8px;
    height:7px;
    border-radius:50%;
    background:#ff3138;
    box-shadow:0 0 12px #ff0000,0 0 25px #ff0000;
    animation:lineDot 4s ease-in-out infinite;
}

.l1{width:90%;left:-12%;top:19%;transform:rotate(-29deg);animation-delay:-.3s}
.l2{width:78%;left:-9%;top:39%;transform:rotate(-18deg);animation-delay:-1.2s}
.l3{width:84%;left:34%;top:28%;transform:rotate(-27deg);animation-delay:-2.1s}
.l4{width:78%;left:42%;top:73%;transform:rotate(-25deg);animation-delay:-.8s}
.l5{width:90%;left:28%;top:84%;transform:rotate(-15deg);animation-delay:-2.8s}
.l6{width:70%;left:67%;top:57%;transform:rotate(-28deg);animation-delay:-1.7s}

@keyframes linePulse{
    0%,100%{opacity:.35;filter:blur(.15px);transform-origin:left center}
    50%{opacity:1;filter:blur(.5px)}
}

@keyframes lineDot{
    0%,100%{opacity:.15;transform:scale(.7)}
    50%{opacity:1;transform:scale(1.5)}
}

/* Barrido luminoso que recorre las líneas */
.scan{
    position:absolute;
    inset:0;
    background:linear-gradient(115deg,
        transparent 38%,
        rgba(255,0,10,.025) 44%,
        rgba(255,20,25,.16) 49%,
        rgba(255,0,10,.025) 54%,
        transparent 60%);
    transform:translateX(-65%);
    animation:scanMove 7s linear infinite;
}

@keyframes scanMove{
    to{transform:translateX(65%)}
}

/* ===== BORDES LATERALES ===== */
.corner{
    position:absolute;
    z-index:-6;
    width:34vw;
    height:100%;
    pointer-events:none;
}

.corner.left{left:-7vw}
.corner.right{right:-7vw;transform:scaleX(-1)}

.corner .border-line{
    position:absolute;
    width:65%;
    height:1px;
    background:linear-gradient(90deg,transparent,#ff1018,transparent);
    box-shadow:0 0 9px #f00,0 0 25px rgba(255,0,0,.5);
    animation:borderTravel 5s ease-in-out infinite;
}

.corner .b1{top:15%;left:0;transform:rotate(-28deg)}
.corner .b2{top:25%;left:2%;transform:rotate(-28deg);animation-delay:-1.2s}
.corner .b3{bottom:22%;left:0;transform:rotate(28deg);animation-delay:-2.4s}
.corner .b4{bottom:12%;left:3%;transform:rotate(28deg);animation-delay:-3.5s}

@keyframes borderTravel{
    0%,100%{opacity:.25}
    50%{opacity:1}
}

/* ===== HUMO / BRILLO ROJO ===== */
.smoke{
    position:absolute;
    inset:0;
    z-index:-8;
    pointer-events:none;
    filter:blur(45px);
}

.smoke:before,
.smoke:after{
    content:"";
    position:absolute;
    width:38vw;
    height:25vh;
    border-radius:50%;
    background:radial-gradient(ellipse,
        rgba(180,0,10,.18) 0%,
        rgba(90,0,5,.10) 35%,
        transparent 72%);
    animation:smokeFloat 10s ease-in-out infinite alternate;
}

.smoke:before{left:5%;top:13%}
.smoke:after{right:4%;bottom:10%;animation-delay:-4s}

@keyframes smokeFloat{
    from{transform:translate(-2%,2%) scale(1)}
    to{transform:translate(3%,-3%) scale(1.18)}
}

/* ===== LOGO DE FONDO MUY SUTIL ===== */
.watermark{
    position:absolute;
    z-index:-5;
    left:50%;
    top:50%;
    transform:translate(-50%,-54%) skewX(-8deg);
    font-family:'Barlow Condensed',sans-serif;
    font-size:min(45vw,56vh);
    font-weight:900;
    line-height:.7;
    color:transparent;
    -webkit-text-stroke:1px rgba(255,0,0,.08);
    text-shadow:0 0 35px rgba(255,0,0,.035);
    opacity:.7;
}

/* ===== PARTÍCULAS ===== */
#particles{position:absolute;inset:0;z-index:0;pointer-events:none}

.particle{
    position:absolute;
    width:2px;
    height:2px;
    background:#ff1a22;
    border-radius:50%;
    box-shadow:0 0 7px #ff0000;
    animation:particleFloat 5s ease-in-out infinite;
}

@keyframes particleFloat{
    0%,100%{opacity:.05;transform:translateY(12px) scale(.5)}
    50%{opacity:.9;transform:translateY(-28px) scale(1.4)}
}

/* ===== PANTALLAS ===== */
.screen{
    position:absolute;
    inset:0;
    z-index:3;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    opacity:0;
    transform:scale(.985);
    transition:opacity .7s ease,transform .7s ease;
    pointer-events:none;
    padding-bottom:5vh;
}

.screen.active{
    opacity:1;
    transform:scale(1);
    pointer-events:auto;
}

/* Entrada animada del contenido */
.screen.active .stream-label{
    animation:contentIn .8s both;
}
.screen.active .main-title{
    animation:titleIn 1s .08s both;
}
.screen.active .sub{
    animation:contentIn .8s .22s both;
}
.screen.active .brand{
    animation:brandIn 1s .32s both;
}

@keyframes contentIn{
    from{opacity:0;transform:translateY(12px);letter-spacing:.7em}
    to{opacity:1;transform:none}
}

@keyframes titleIn{
    from{opacity:0;transform:scale(.94);filter:blur(7px)}
    to{opacity:1;transform:scale(1);filter:blur(0)}
}

@keyframes brandIn{
    from{opacity:0;transform:translateY(18px);filter:blur(4px)}
    to{opacity:1;transform:none;filter:blur(0)}
}

/* ===== CABECERA STREAM ===== */
.stream-label{
    position:relative;
    margin-bottom:22px;
    padding:0 42px;
    color:#f4eaea;
    font-size:clamp(12px,1.1vw,20px);
    font-weight:600;
    letter-spacing:.48em;
    text-transform:uppercase;
    text-shadow:0 0 8px rgba(255,0,0,.3);
}

.stream-label:before,
.stream-label:after{
    content:"";
    position:absolute;
    top:50%;
    width:clamp(45px,8vw,130px);
    height:1px;
    background:linear-gradient(90deg,transparent,#d80008);
    box-shadow:0 0 7px rgba(255,0,0,.6);
}

.stream-label:before{right:100%}
.stream-label:after{left:100%;transform:scaleX(-1)}

.stream-mark{
    position:absolute;
    left:50%;
    top:-24px;
    transform:translateX(-50%) skewX(-20deg);
    display:flex;
    gap:5px;
}

.stream-mark i{
    display:block;
    width:7px;
    height:16px;
    background:linear-gradient(180deg,#fff,#d40008);
    box-shadow:0 0 8px rgba(255,0,0,.45);
}

/* ===== TITULO ===== */
.main-title{
    display:flex;
    justify-content:center;
    align-items:baseline;
    flex-wrap:wrap;
    gap:.18em;
    max-width:95vw;
    font-family:'Barlow Condensed','Arial Narrow',sans-serif;
    font-size:clamp(62px,10vw,170px);
    line-height:.78;
    font-weight:800;
    letter-spacing:.015em;
    text-transform:uppercase;
    filter:drop-shadow(0 12px 18px rgba(0,0,0,.8));
}

.main-title .white{
    background:linear-gradient(180deg,#fff 0%,#ededed 45%,#8d8d8d 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
}

.main-title .red{
    background:linear-gradient(180deg,#ff3a3f 0%,#ef050c 45%,#760006 100%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:redTextPulse 2.5s ease-in-out infinite alternate;
}

@keyframes redTextPulse{
    from{filter:drop-shadow(0 0 5px rgba(255,0,0,.2))}
    to{filter:drop-shadow(0 0 18px rgba(255,0,0,.38))}
}

/* ===== SUBTITULO ===== */
.sub{
    position:relative;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-top:28px;
    padding:9px 48px;
    color:#d6d6d6;
    font-size:clamp(11px,1.25vw,22px);
    letter-spacing:.33em;
    font-weight:500;
    white-space:nowrap;
    text-transform:uppercase;
}

.sub .rule{
    position:absolute;
    left:0;
    right:0;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,0,0,.7),transparent);
}

.sub .top{top:0}
.sub .bottom{bottom:0}

.sub:before,
.sub:after{
    content:"";
    position:absolute;
    width:8px;
    height:5px;
    background:#f20a11;
    box-shadow:0 0 8px rgba(255,0,0,.8);
}

.sub:before{left:0}
.sub:after{right:0}

/* ===== R3DFIELD ===== */
.brand{
    margin-top:38px;
    font-family:'Barlow Condensed',sans-serif;
    font-size:clamp(34px,3.5vw,60px);
    font-weight:700;
    letter-spacing:.25em;
    color:#ededed;
    text-transform:uppercase;
    text-shadow:0 0 12px rgba(255,0,0,.12);
}

.brand .r3{
    color:#ff0d15;
    text-shadow:0 0 12px rgba(255,0,0,.42),0 0 30px rgba(255,0,0,.15);
}

/* ===== BARRA SOCIAL ===== */
.social-bar{
    position:absolute;
    z-index:8;
    left:50%;
    bottom:7.2%;
    transform:translateX(-50%);
    width:min(52vw,880px);
    min-width:500px;
    height:70px;
    display:grid;
    grid-template-columns:1fr 1px 1fr 1px 1fr;
    align-items:center;
    background:rgba(2,2,2,.78);
    border:1px solid rgba(255,0,0,.35);
    clip-path:polygon(3% 0,97% 0,100% 22%,100% 78%,97% 100%,3% 100%,0 78%,0 22%);
    box-shadow:inset 0 0 25px rgba(255,0,0,.04),0 0 25px rgba(255,0,0,.06);
    backdrop-filter:blur(6px);
}

.social{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:14px;
    color:#d8d8d8;
    font-size:clamp(10px,1vw,16px);
    letter-spacing:.13em;
}

.social .icon{
    width:31px;
    height:31px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    background:#e50008;
    font-family:Arial,sans-serif;
    font-weight:900;
    clip-path:polygon(15% 0,85% 0,100% 15%,100% 85%,85% 100%,15% 100%,0 85%,0 15%);
    box-shadow:0 0 13px rgba(255,0,0,.35);
}

.social.x .icon{
    background:none;
    box-shadow:none;
    font-size:27px;
}

.social-divider{
    width:1px;
    height:28px;
    background:rgba(255,255,255,.28);
}

/* ===== ALERTA ===== */
.donation-type{
    border:1px solid rgba(255,0,0,.5);
    padding:8px 25px;
    color:#fff;
    letter-spacing:.3em;
    font-size:16px;
}

.donation-amount{
    margin:5px 0;
    font-family:'Barlow Condensed',sans-serif;
    font-size:clamp(75px,10vw,160px);
    color:#ff1018;
    text-shadow:0 0 28px rgba(255,0,0,.45);
}

.donation-message{
    margin-top:18px;
    color:#ccc;
    font-size:clamp(12px,1.5vw,22px);
    letter-spacing:.08em;
}

/* ===== CONTROLES DE PRUEBA ===== */
.controls{
    position:fixed;
    z-index:30;
    left:50%;
    bottom:13px;
    transform:translateX(-50%);
    display:flex;
    gap:7px;
    padding:7px 10px;
    background:rgba(0,0,0,.8);
    border:1px solid rgba(255,0,0,.25);
    border-radius:5px;
    opacity:.18;
    transition:.25s;
}

.controls:hover{opacity:1}

.controls button{
    border:1px solid #b50008;
    background:#050505;
    color:#ddd;
    padding:6px 12px;
    cursor:pointer;
    font-family:'Oswald',sans-serif;
    font-size:11px;
}

.controls button.active-btn,
.controls button:hover{
    background:#d80008;
    color:#000;
}

.hint{
    display:flex;
    align-items:center;
    color:#666;
    font-size:10px;
    padding-left:6px;
}

/* ===== RESPONSIVE ===== */
@media(max-width:800px){
    .main-title{font-size:clamp(48px,12vw,90px)}
    .social-bar{min-width:0;width:92vw}
    .social{font-size:8px;gap:7px}
    .social .icon{width:23px;height:23px;font-size:12px}
    .brand{font-size:28px}
    .controls{display:none}
}

@media(max-width:500px){
    .main-title{font-size:clamp(40px,14vw,70px)}
    .sub{font-size:9px;letter-spacing:.16em;padding:8px 25px}
    .social-bar{height:58px}
    .social-divider{height:22px}
}
</style>
</head>

<body>

<div class="container" id="container">

    <div class="smoke"></div>

    <div class="line-system">
        <div class="neon-line l1"></div>
        <div class="neon-line l2"></div>
        <div class="neon-line l3"></div>
        <div class="neon-line l4"></div>
        <div class="neon-line l5"></div>
        <div class="neon-line l6"></div>
        <div class="scan"></div>
    </div>

    <div class="corner left">
        <div class="border-line b1"></div>
        <div class="border-line b2"></div>
        <div class="border-line b3"></div>
        <div class="border-line b4"></div>
    </div>

    <div class="corner right">
        <div class="border-line b1"></div>
        <div class="border-line b2"></div>
        <div class="border-line b3"></div>
        <div class="border-line b4"></div>
    </div>

    <div class="watermark">R3</div>
    <div id="particles"></div>

    <!-- ===== STARTING SOON ===== -->
    <div class="screen active" id="screen-start">

        <div class="stream-label">
            <div class="stream-mark">
                <i></i><i></i><i></i>
            </div>
            STREAM
        </div>

        <div class="main-title">
            <span class="white">STARTING</span>
            <span class="red">SOON...</span>
        </div>

        <div class="sub">
            <span class="rule top"></span>
            THE STREAM WILL BEGIN SHORTLY
            <span class="rule bottom"></span>
        </div>

        <div class="brand">
            <span class="r3">R3</span>DFIELD
        </div>
    </div>

    <!-- ===== BE RIGHT BACK ===== -->
    <div class="screen" id="screen-brb">

        <div class="stream-label">
            <div class="stream-mark">
                <i></i><i></i><i></i>
            </div>
            STREAM
        </div>

        <div class="main-title">
            <span class="white">BE</span>
            <span class="red">RIGHT</span>
            <span class="white">BACK</span>
        </div>

        <div class="sub">
            <span class="rule top"></span>
            TAKING A SHORT BREAK
            <span class="rule bottom"></span>
        </div>

        <div class="brand">
            <span class="r3">R3</span>DFIELD
        </div>
    </div>

    <!-- ===== DONATION ===== -->
    <div class="screen" id="screen-donation">

        <div class="stream-label">STREAM</div>

        <div class="donation-type">TIP</div>

        <div class="donation-amount">$23</div>

        <div class="brand">
            <span class="r3">R3</span>DFIELD
        </div>

        <div class="donation-message">
            "it's debwulodirty the hacker on linux"
        </div>
    </div>

    <!-- ===== BARRA INFERIOR ===== -->
    <div class="social-bar">

        <div class="social">
            <span class="icon">▶</span>
            <span>R3dfield</span>
        </div>

        <div class="social-divider"></div>

        <div class="social x">
            <span class="icon">𝕏</span>
            <span>R3dfield1</span>
        </div>

        <div class="social-divider"></div>

        <div class="social">
            <span class="icon">◉</span>
            <span>r3dfield</span>
        </div>

    </div>

    <div class="countdown" id="countdown">05:00</div>
</div>

<!-- CONTROLES SOLO PARA PRUEBAS -->
<div class="controls">
    <button id="btn-start" class="active-btn">▶ START</button>
    <button id="btn-brb">⏸ BRB</button>
    <button id="btn-donation">TIP</button>
    <div class="hint">1 · 2 · 3</div>
</div>

<script>
/* ===== PARTICULAS ===== */
(function(){
    const container=document.getElementById('particles');

    for(let i=0;i<70;i++){
        const p=document.createElement('div');
        p.className='particle';
        p.style.left=(Math.random()*100)+'%';
        p.style.top=(Math.random()*100)+'%';
        p.style.animationDelay=(Math.random()*5)+'s';
        p.style.animationDuration=(3+Math.random()*5)+'s';

        const s=1+Math.random()*2.5;
        p.style.width=s+'px';
        p.style.height=s+'px';

        container.appendChild(p);
    }
})();

/* ===== CAMBIO DE PANTALLA ===== */
const screenStart=document.getElementById('screen-start');
const screenBrb=document.getElementById('screen-brb');
const screenDonation=document.getElementById('screen-donation');

const btnStart=document.getElementById('btn-start');
const btnBrb=document.getElementById('btn-brb');
const btnDonation=document.getElementById('btn-donation');

function setScreen(screen){
    screenStart.classList.remove('active');
    screenBrb.classList.remove('active');
    screenDonation.classList.remove('active');

    btnStart.classList.remove('active-btn');
    btnBrb.classList.remove('active-btn');
    btnDonation.classList.remove('active-btn');

    if(screen==='start'){
        screenStart.classList.add('active');
        btnStart.classList.add('active-btn');
    }

    if(screen==='brb'){
        screenBrb.classList.add('active');
        btnBrb.classList.add('active-btn');
    }

    if(screen==='donation'){
        screenDonation.classList.add('active');
        btnDonation.classList.add('active-btn');
    }
}

btnStart.onclick=()=>setScreen('start');
btnBrb.onclick=()=>setScreen('brb');
btnDonation.onclick=()=>setScreen('donation');

document.addEventListener('keydown',(e)=>{
    if(e.key==='1')setScreen('start');
    if(e.key==='2')setScreen('brb');
    if(e.key==='3')setScreen('donation');
});

/* ===== CONTADOR ORIGINAL, MANTENIDO ===== */
let timeLeft=5*60;
const countdown=document.getElementById('countdown');

function updateCountdown(){
    const minutes=Math.floor(timeLeft/60);
    const seconds=timeLeft%60;

    countdown.textContent=
        String(minutes).padStart(2,'0')+':'+
        String(seconds).padStart(2,'0');

    if(timeLeft>0)timeLeft--;
    else timeLeft=5*60;
}

setInterval(updateCountdown,1000);
updateCountdown();
</script>

</body>
</html>

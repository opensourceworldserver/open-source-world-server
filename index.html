<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R3DFIELD - Overlays</title>
    <!-- Fuente gamer de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* ----- RESET Y FONDO ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0a;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        /* ----- CONTENEDOR PRINCIPAL ----- */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(ellipse at center, #1a0000 0%, #0a0a0a 70%);
            overflow: hidden;
        }

        /* Efecto de luz ambiente (sutil) */
        .container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(255,0,0,0.05) 0%, transparent 60%);
            animation: rotateGlow 20s linear infinite;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg) scale(1); }
            100% { transform: rotate(360deg) scale(1.2); }
        }

        /* ----- PARTÍCULAS (estrellitas) ----- */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255,50,50,0.6);
            border-radius: 50%;
            animation: floatParticle 6s infinite ease-in-out;
            pointer-events: none;
        }
        @keyframes floatParticle {
            0% { transform: translateY(0px) scale(1); opacity: 0.2; }
            50% { transform: translateY(-30px) scale(1.5); opacity: 0.8; }
            100% { transform: translateY(0px) scale(1); opacity: 0.2; }
        }

        /* ----- OVERLAY (cada pantalla) ----- */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            transform: scale(0.95);
            transition: opacity 0.8s ease, transform 0.8s ease;
            pointer-events: none;
            z-index: 1;
        }
        .screen.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* ----- TEXTO PRINCIPAL (STREAM / STARTING SOON) ----- */
        .line1 {
            font-size: clamp(2rem, 8vw, 6rem);
            font-weight: 700;
            letter-spacing: 0.5rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,50,50,0.3);
            margin-bottom: 0.2em;
        }
        .line2 {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 900;
            letter-spacing: 0.3rem;
            color: #ff1a1a;
            text-shadow: 0 0 20px rgba(255,0,0,0.8), 0 0 60px rgba(255,0,0,0.4);
            animation: pulseGlow 2s infinite alternate;
        }
        @keyframes pulseGlow {
            0% { text-shadow: 0 0 20px rgba(255,0,0,0.6), 0 0 60px rgba(255,0,0,0.3); }
            100% { text-shadow: 0 0 40px rgba(255,0,0,1), 0 0 80px rgba(255,0,0,0.6), 0 0 120px rgba(255,0,0,0.3); }
        }

        /* ----- SUBTÍTULO (THE STREAM WILL BEGIN SHORTLY / TAKING A SHORT BREAK) ----- */
        .sub {
            font-size: clamp(1rem, 3vw, 2rem);
            font-weight: 400;
            letter-spacing: 0.3rem;
            color: #aaa;
            margin: 0.5em 0 1.5em 0;
            text-transform: uppercase;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 0.5em 1.5em;
            background: rgba(255,255,255,0.02);
        }

        /* ----- NOMBRE R3DFIELD (con neón) ----- */
        .brand {
            font-size: clamp(2.5rem, 8vw, 6rem);
            font-weight: 900;
            letter-spacing: 0.6rem;
            color: #ff1a1a;
            text-shadow: 0 0 30px rgba(255,0,0,0.8), 0 0 90px rgba(255,0,0,0.5), 0 0 150px rgba(255,0,0,0.2);
            animation: neonPulse 3s infinite alternate;
            margin-top: 0.3em;
        }
        @keyframes neonPulse {
            0% { text-shadow: 0 0 30px rgba(255,0,0,0.8), 0 0 60px rgba(255,0,0,0.4); }
            100% { text-shadow: 0 0 50px rgba(255,0,0,1), 0 0 100px rgba(255,0,0,0.7), 0 0 150px rgba(255,0,0,0.3); }
        }

        /* ----- VARIANTES DE R3DFIELD (como en las imágenes) ----- */
        .brand-variants {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            margin-top: 0.8em;
            font-size: clamp(0.8rem, 2vw, 1.4rem);
            color: #555;
            letter-spacing: 0.2rem;
        }
        .brand-variants span {
            opacity: 0.6;
            transition: opacity 0.3s;
        }
        .brand-variants span:hover {
            opacity: 1;
            color: #ff4444;
        }

        /* ----- CONTADOR REGRESIVO (solo en Starting Soon) ----- */
        .countdown {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-top: 0.5em;
            color: #ff4444;
            text-shadow: 0 0 20px rgba(255,0,0,0.4);
            letter-spacing: 0.2rem;
            background: rgba(0,0,0,0.4);
            padding: 0.2em 1em;
            border-radius: 8px;
            border: 1px solid rgba(255,0,0,0.2);
        }

        /* ----- BOTÓN DE CAMBIO (solo para prueba) ----- */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 20px;
            background: rgba(0,0,0,0.7);
            padding: 12px 24px;
            border-radius: 50px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .controls button {
            background: transparent;
            border: 2px solid #ff1a1a;
            color: #ff1a1a;
            padding: 8px 20px;
            border-radius: 30px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
        }
        .controls button:hover {
            background: #ff1a1a;
            color: #0a0a0a;
        }
        .controls button.active-btn {
            background: #ff1a1a;
            color: #0a0a0a;
        }
        .controls .hint {
            color: #777;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            margin-left: 10px;
            border-left: 1px solid #333;
            padding-left: 15px;
        }

        /* ----- RESPONSIVE (para móviles) ----- */
        @media (max-width: 768px) {
            .line1 { font-size: 1.8rem; letter-spacing: 0.2rem; }
            .line2 { font-size: 2.8rem; }
            .sub { font-size: 0.9rem; padding: 0.3em 1em; }
            .brand { font-size: 2.5rem; }
            .brand-variants { font-size: 0.7rem; gap: 0.8rem; flex-wrap: wrap; }
            .controls { padding: 10px 16px; gap: 10px; flex-wrap: wrap; justify-content: center; }
            .controls button { font-size: 0.7rem; padding: 5px 12px; }
            .hint { display: none; }
        }
    </style>
</head>
<body>
    <div class="container" id="container">
        <!-- Partículas generadas por JS -->
        <div id="particles"></div>

        <!-- ===== PANTALLA 1: STARTING SOON ===== -->
        <div class="screen active" id="screen-start">
            <div class="line1">STREAM</div>
            <div class="line2">STARTING SOON</div>
            <div class="sub">THE STREAM WILL BEGIN SHORTLY</div>
            <div class="brand">R3DFIELD</div>
            <div class="brand-variants">
                <span>R3DFIELD</span>
                <span>R3dfield</span>
                <span>r3dfield</span>
                <span>R3DFIELD1</span>
            </div>
            <div class="countdown" id="countdown">05:00</div>
        </div>

        <!-- ===== PANTALLA 2: BE RIGHT BACK ===== -->
        <div class="screen" id="screen-brb">
            <div class="line1">STREAM</div>
            <div class="line2">BE RIGHT BACK</div>
            <div class="sub">TAKING A SHORT BREAK</div>
            <div class="brand">R3DFIELD</div>
            <div class="brand-variants">
                <span>R3DFIELD</span>
                <span>R3dfield</span>
                <span>×</span>
                <span>r3dfield</span>
                <span>R3DFIELD1</span>
            </div>
            <!-- Sin contador en BRB -->
        </div>
    </div>

    <!-- ===== CONTROLES (solo para pruebas) ===== -->
    <div class="controls">
        <button id="btn-start" class="active-btn">▶ START</button>
        <button id="btn-brb">⏸ BRB</button>
        <div class="hint">Tecla 1 · 2</div>
    </div>

    <script>
        // ----- PARTÍCULAS -----
        (function createParticles() {
            const container = document.getElementById('particles');
            const count = 50;
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDelay = (Math.random() * 6) + 's';
                p.style.animationDuration = (4 + Math.random() * 4) + 's';
                p.style.width = (1 + Math.random() * 3) + 'px';
                p.style.height = p.style.width;
                container.appendChild(p);
            }
        })();

        // ----- CAMBIAR PANTALLA -----
        const screenStart = document.getElementById('screen-start');
        const screenBrb = document.getElementById('screen-brb');
        const btnStart = document.getElementById('btn-start');
        const btnBrb = document.getElementById('btn-brb');

        function setScreen(screen) {
            // Ocultar todas
            screenStart.classList.remove('active');
            screenBrb.classList.remove('active');
            btnStart.classList.remove('active-btn');
            btnBrb.classList.remove('active-btn');

            if (screen === 'start') {
                screenStart.classList.add('active');
                btnStart.classList.add('active-btn');
            } else {
                screenBrb.classList.add('active');
                btnBrb.classList.add('active-btn');
            }
        }

        btnStart.addEventListener('click', () => setScreen('start'));
        btnBrb.addEventListener('click', () => setScreen('brb'));

        // Atajos de teclado (1 y 2)
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') setScreen('start');
            if (e.key === '2') setScreen('brb');
        });

        // ----- CONTADOR REGRESIVO (ejemplo 5 minutos) -----
        let timeLeft = 5 * 60; // 5 minutos en segundos
        const countdownEl = document.getElementById('countdown');

        function updateCountdown() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            countdownEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            if (timeLeft > 0) {
                timeLeft--;
            } else {
                // Cuando llega a 0, se reinicia (para ejemplo)
                timeLeft = 5 * 60;
            }
        }
        // Actualizar cada segundo
        setInterval(updateCountdown, 1000);
        // Inicializar
        updateCountdown();

        console.log('✅ Overlay R3DFIELD listo. Usa teclas 1 y 2 para cambiar.');
    </script>
</body>
</html>

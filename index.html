<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R3DFIELD - Overlay</title>

    <!-- Fuente condensada similar al estilo de las referencias -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --red: #f10b0b;
            --red-hot: #ff1b1b;
            --red-dark: #650000;
            --white: #f4f4f4;
            --gray: #9b9b9b;
            --black: #030303;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020202;
        }

        body {
            color: var(--white);
            font-family: 'Oswald', Arial, sans-serif;
        }

        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            isolation: isolate;
            background:
                radial-gradient(ellipse at 50% 52%, rgba(105, 0, 0, .28) 0%, rgba(25, 0, 0, .16) 28%, transparent 58%),
                radial-gradient(ellipse at 18% 75%, rgba(255, 0, 0, .17) 0%, transparent 31%),
                radial-gradient(ellipse at 82% 75%, rgba(255, 0, 0, .17) 0%, transparent 31%),
                linear-gradient(180deg, #020202 0%, #080808 48%, #030303 100%);
        }

        /* Textura oscura */
        .container::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: -6;
            opacity: .5;
            background:
                repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 4px),
                repeating-linear-gradient(90deg, rgba(255,0,0,.008) 0 1px, transparent 1px 7px);
            pointer-events: none;
        }

        /* Gran humo rojo difuminado */
        .smoke {
            position: absolute;
            inset: 0;
            z-index: -5;
            pointer-events: none;
            filter: blur(30px);
            opacity: .7;
        }

        .smoke::before,
        .smoke::after {
            content: "";
            position: absolute;
            width: 42vw;
            height: 27vh;
            border-radius: 50%;
            background:
                radial-gradient(ellipse, rgba(255, 24, 24, .28) 0%, rgba(120,0,0,.15) 35%, transparent 72%);
            animation: smokeMove 9s ease-in-out infinite alternate;
        }

        .smoke::before {
            left: 8%;
            top: 18%;
            transform: rotate(-13deg);
        }

        .smoke::after {
            right: 8%;
            top: 22%;
            transform: rotate(13deg);
            animation-delay: -4s;
        }

        @keyframes smokeMove {
            from { transform: translate3d(-2%, 2%, 0) scale(1); }
            to   { transform: translate3d(3%, -3%, 0) scale(1.12); }
        }

        /* Suelo rojo */
        .floor {
            position: absolute;
            left: -10%;
            right: -10%;
            bottom: -12%;
            height: 30%;
            z-index: -4;
            transform: perspective(500px) rotateX(60deg);
            transform-origin: bottom;
            background:
                radial-gradient(ellipse at center, rgba(255, 0, 0, .34), transparent 57%),
                repeating-linear-gradient(90deg, transparent 0 7%, rgba(255,0,0,.08) 7.05% 7.1%, transparent 7.15% 14%);
            box-shadow: 0 -25px 90px rgba(255,0,0,.16);
        }

        /* Reflejo/horizonte */
        .horizon {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 20%;
            height: 2px;
            z-index: -3;
            background: linear-gradient(90deg, transparent, rgba(255,0,0,.9) 15%, rgba(255,35,35,.5) 50%, rgba(255,0,0,.9) 85%, transparent);
            box-shadow: 0 0 22px rgba(255,0,0,.55);
        }

        /* Paneles angulares laterales */
        .side {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 25vw;
            z-index: -2;
            opacity: .95;
        }

        .side.left {
            left: 0;
            clip-path: polygon(0 0, 43% 0, 86% 37%, 68% 50%, 86% 63%, 43% 100%, 0 100%, 0 72%, 26% 50%, 0 28%);
            background:
                linear-gradient(135deg, rgba(255,0,0,.08), transparent 40%),
                linear-gradient(315deg, rgba(255,0,0,.06), transparent 48%),
                #050505;
        }

        .side.right {
            right: 0;
            transform: scaleX(-1);
            clip-path: polygon(0 0, 43% 0, 86% 37%, 68% 50%, 86% 63%, 43% 100%, 0 100%, 0 72%, 26% 50%, 0 28%);
            background:
                linear-gradient(135deg, rgba(255,0,0,.08), transparent 40%),
                linear-gradient(315deg, rgba(255,0,0,.06), transparent 48%),
                #050505;
        }

        .side::after {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(90deg, transparent 0 10px, rgba(255,255,255,.018) 11px 12px);
        }

        .edge {
            position: absolute;
            top: 3%;
            bottom: 3%;
            width: 20vw;
            z-index: -1;
            pointer-events: none;
        }

        .edge.left {
            left: -2vw;
            border-right: 3px solid rgba(255, 0, 0, .8);
            transform: skewX(-31deg);
            box-shadow: 12px 0 12px rgba(255,0,0,.15);
        }

        .edge.right {
            right: -2vw;
            border-left: 3px solid rgba(255, 0, 0, .8);
            transform: skewX(31deg);
            box-shadow: -12px 0 12px rgba(255,0,0,.15);
        }

        /* Logo gigante del fondo */
        .watermark {
            position: absolute;
            top: 1%;
            left: 50%;
            transform: translateX(-50%);
            z-index: -2;
            font-family: Arial, sans-serif;
            font-size: min(48vw, 55vh);
            line-height: .8;
            font-weight: 900;
            font-style: italic;
            color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,.10);
            text-shadow:
                0 0 2px rgba(255,0,0,.18),
                0 0 45px rgba(255,0,0,.05);
            opacity: .7;
            user-select: none;
        }

        /* Pequeños detalles luminosos */
        .sparks {
            position: absolute;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(circle at 17% 24%, rgba(255,30,30,.9) 0 1px, transparent 2px),
                radial-gradient(circle at 30% 19%, rgba(255,30,30,.8) 0 1px, transparent 2px),
                radial-gradient(circle at 67% 27%, rgba(255,30,30,.9) 0 1px, transparent 2px),
                radial-gradient(circle at 84% 18%, rgba(255,30,30,.8) 0 1px, transparent 2px),
                radial-gradient(circle at 76% 50%, rgba(255,30,30,.9) 0 2px, transparent 4px),
                radial-gradient(circle at 24% 52%, rgba(255,30,30,.8) 0 1px, transparent 3px);
            animation: sparks 4s ease-in-out infinite alternate;
        }

        @keyframes sparks {
            from { opacity: .45; }
            to { opacity: 1; }
        }

        /* Partículas */
        #particles {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 35, 35, .7);
            box-shadow: 0 0 6px rgba(255,0,0,.7);
            border-radius: 50%;
            animation: floatParticle 5s ease-in-out infinite;
        }

        @keyframes floatParticle {
            0%,100% { transform: translateY(10px) scale(.6); opacity: .15; }
            50% { transform: translateY(-35px) scale(1.5); opacity: .9; }
        }

        /* Pantallas */
        .screen {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            transform: scale(.985);
            transition: opacity .65s ease, transform .65s ease;
            pointer-events: none;
            padding-bottom: 6vh;
        }

        .screen.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .stream-label {
            position: relative;
            margin-bottom: 18px;
            padding: 0 42px;
            font-size: clamp(14px, 1.25vw, 24px);
            font-weight: 600;
            letter-spacing: .48em;
            color: var(--red);
            text-transform: uppercase;
        }

        .stream-label::before,
        .stream-label::after {
            content: "";
            position: absolute;
            top: 50%;
            width: clamp(45px, 7vw, 120px);
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--red));
            box-shadow: 0 0 8px rgba(255,0,0,.55);
        }

        .stream-label::before {
            right: 100%;
        }

        .stream-label::after {
            left: 100%;
            transform: scaleX(-1);
        }

        .stream-mark {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%) skewX(-20deg);
            display: flex;
            gap: 7px;
        }

        .stream-mark span {
            width: 8px;
            height: 18px;
            background: linear-gradient(180deg, #fff, var(--red));
        }

        .main-title {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: .18em;
            flex-wrap: wrap;
            max-width: 94vw;
            font-family: 'Bebas Neue', 'Arial Narrow', sans-serif;
            font-size: clamp(54px, 9.7vw, 160px);
            line-height: .82;
            letter-spacing: .025em;
            font-weight: 400;
            text-transform: uppercase;
            filter: drop-shadow(0 8px 14px rgba(0,0,0,.75));
        }

        .main-title .white {
            color: #eee;
            background: linear-gradient(180deg, #fff 0%, #d9d9d9 55%, #888 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .main-title .red {
            color: var(--red);
            background: linear-gradient(180deg, #ff3434 0%, #e30000 55%, #780000 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 28px rgba(255,0,0,.22);
        }

        .sub {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-top: 28px;
            padding: 8px 48px;
            font-size: clamp(12px, 1.45vw, 24px);
            font-weight: 500;
            letter-spacing: .32em;
            color: #ddd;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .sub::before,
        .sub::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 5px;
            background: var(--red);
            box-shadow: 0 0 10px rgba(255,0,0,.7);
        }

        .sub::before { left: 0; }
        .sub::after { right: 0; }

        .sub span {
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,0,0,.75), transparent);
            box-shadow: 0 0 7px rgba(255,0,0,.4);
        }

        .sub span:last-child {
            top: auto;
            bottom: 0;
        }

        .brand {
            margin-top: 38px;
            font-family: 'Oswald', sans-serif;
            font-size: clamp(30px, 3.1vw, 56px);
            letter-spacing: .22em;
            font-weight: 600;
            color: #eee;
            text-transform: uppercase;
        }

        .brand .r {
            color: var(--red);
            text-shadow: 0 0 14px rgba(255,0,0,.4);
        }

        .brand-variants {
            display: none;
        }

        /* Barra inferior inspirada directamente en las referencias */
        .social-bar {
            position: absolute;
            z-index: 6;
            left: 50%;
            bottom: 8.5%;
            transform: translateX(-50%);
            width: min(52vw, 880px);
            min-width: 520px;
            height: 72px;
            display: grid;
            grid-template-columns: 1fr 1px 1fr 1px 1fr;
            align-items: center;
            background: rgba(2,2,2,.84);
            border: 1px solid rgba(255,0,0,.4);
            clip-path: polygon(3% 0, 97% 0, 100% 22%, 100% 78%, 97% 100%, 3% 100%, 0 78%, 0 22%);
            box-shadow:
                0 0 25px rgba(255,0,0,.08),
                inset 0 0 25px rgba(255,0,0,.04);
            backdrop-filter: blur(5px);
        }

        .social-divider {
            width: 1px;
            height: 28px;
            background: rgba(255,255,255,.35);
        }

        .social {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            color: #ddd;
            font-size: clamp(11px, 1vw, 17px);
            letter-spacing: .13em;
            white-space: nowrap;
        }

        .social .icon {
            display: inline-flex;
            width: 32px;
            height: 32px;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            font-weight: 900;
            font-size: 18px;
            color: #fff;
            background: var(--red);
            clip-path: polygon(16% 0, 84% 0, 100% 16%, 100% 84%, 84% 100%, 16% 100%, 0 84%, 0 16%);
            box-shadow: 0 0 14px rgba(255,0,0,.3);
        }

        .social.x .icon {
            background: transparent;
            font-size: 29px;
            box-shadow: none;
        }

        .countdown {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
        }

        /* Mantiene la lógica de donaciones, pero visualmente integrada */
        .donation-message {
            margin-top: 24px;
            color: #ccc;
            font-size: clamp(13px, 1.6vw, 24px);
            letter-spacing: .08em;
        }

        .donation-amount {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(70px, 10vw, 160px);
            color: var(--red);
            text-shadow: 0 0 25px rgba(255,0,0,.5);
        }

        .donation-type {
            color: #fff;
            font-size: 18px;
            letter-spacing: .3em;
            text-transform: uppercase;
            border: 1px solid rgba(255,0,0,.45);
            padding: 8px 24px;
            margin-bottom: 10px;
        }

        /* Controles de prueba */
        .controls {
            position: fixed;
            z-index: 20;
            left: 50%;
            bottom: 15px;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            padding: 8px 12px;
            background: rgba(0,0,0,.8);
            border: 1px solid rgba(255,0,0,.25);
            border-radius: 6px;
            opacity: .25;
            transition: opacity .25s;
        }

        .controls:hover {
            opacity: 1;
        }

        .controls button {
            border: 1px solid var(--red);
            background: rgba(0,0,0,.55);
            color: #fff;
            padding: 7px 14px;
            cursor: pointer;
            font-family: 'Oswald', sans-serif;
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .controls button.active-btn,
        .controls button:hover {
            background: var(--red);
            color: #000;
        }

        .hint {
            color: #777;
            font-size: 11px;
            display: flex;
            align-items: center;
            padding-left: 8px;
        }

        @media (max-width: 900px) {
            .social-bar {
                min-width: 420px;
                width: 70vw;
            }

            .social {
                font-size: 10px;
                gap: 8px;
            }

            .social .icon {
                width: 25px;
                height: 25px;
            }
        }

        @media (max-width: 600px) {
            .main-title {
                font-size: clamp(44px, 13vw, 78px);
            }

            .sub {
                font-size: 10px;
                letter-spacing: .18em;
                padding: 7px 25px;
            }

            .social-bar {
                min-width: 0;
                width: 92vw;
                height: 60px;
            }

            .social {
                font-size: 8px;
                gap: 5px;
                letter-spacing: .06em;
            }

            .social .icon {
                width: 22px;
                height: 22px;
                font-size: 13px;
            }

            .brand {
                margin-top: 25px;
                font-size: 25px;
            }

            .controls {
                display: none;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="container">
        <div class="smoke"></div>
        <div class="floor"></div>
        <div class="horizon"></div>
        <div class="side left"></div>
        <div class="side right"></div>
        <div class="edge left"></div>
        <div class="edge right"></div>
        <div class="watermark">R3</div>
        <div class="sparks"></div>
        <div id="particles"></div>

        <!-- ===== PANTALLA 1: STARTING SOON ===== -->
        <div class="screen active" id="screen-start">
            <div class="stream-label">
                <div class="stream-mark"><span></span><span></span><span></span></div>
                STREAM
            </div>

            <div class="main-title">
                <span class="white">STARTING</span>
                <span class="red">SOON...</span>
            </div>

            <div class="sub">
                <span></span>
                THE STREAM WILL BEGIN SHORTLY
                <span></span>
            </div>

            <div class="brand"><span class="r">R3</span>DFIELD</div>

            <!-- Se mantiene para no romper la lógica original -->
            <div class="countdown" id="countdown">05:00</div>
        </div>

        <!-- ===== PANTALLA 2: BE RIGHT BACK ===== -->
        <div class="screen" id="screen-brb">
            <div class="stream-label">
                <div class="stream-mark"><span></span><span></span><span></span></div>
                STREAM
            </div>

            <div class="main-title">
                <span class="white">BE</span>
                <span class="red">RIGHT</span>
                <span class="white">BACK</span>
            </div>

            <div class="sub">
                <span></span>
                TAKING A SHORT BREAK
                <span></span>
            </div>

            <div class="brand"><span class="r">R3</span>DFIELD</div>
        </div>

        <!-- ===== PANTALLA 3: DONATION ALERT ===== -->
        <div class="screen" id="screen-donation">
            <div class="stream-label">STREAM</div>
            <div class="donation-type">TIP</div>
            <div class="donation-amount">$23</div>
            <div class="brand"><span class="r">R3</span>DFIELD</div>
            <div class="donation-message">"it's debwulodirty the hacker on linux"</div>
        </div>

        <!-- Barra inferior como en las referencias -->
        <div class="social-bar">
            <div class="social">
                <span class="icon">▶</span>
                <span>R3dfield</span>
            </div>

            <div class="social-divider"></div>

            <div class="social x">
                <span class="icon">𝕏</span>
                <span>R3dfield1</span>
            </div>

            <div class="social-divider"></div>

            <div class="social">
                <span class="icon">◉</span>
                <span>r3dfield</span>
            </div>
        </div>
    </div>

    <!-- ===== CONTROLES (solo para pruebas) ===== -->
    <div class="controls">
        <button id="btn-start" class="active-btn">▶ START</button>
        <button id="btn-brb">⏸ BRB</button>
        <button id="btn-donation">💲 TIP</button>
        <div class="hint">Tecla 1 · 2 · 3</div>
    </div>

    <script>
        // ----- PARTÍCULAS -----
        (function createParticles() {
            const container = document.getElementById('particles');
            const count = 65;

            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = (Math.random() * 82) + '%';
                p.style.animationDelay = (Math.random() * 5) + 's';
                p.style.animationDuration = (3 + Math.random() * 5) + 's';

                const size = (1 + Math.random() * 2.5);
                p.style.width = size + 'px';
                p.style.height = size + 'px';

                container.appendChild(p);
            }
        })();

        // ----- CAMBIAR PANTALLA -----
        const screenStart = document.getElementById('screen-start');
        const screenBrb = document.getElementById('screen-brb');
        const screenDonation = document.getElementById('screen-donation');

        const btnStart = document.getElementById('btn-start');
        const btnBrb = document.getElementById('btn-brb');
        const btnDonation = document.getElementById('btn-donation');

        function setScreen(screen) {
            screenStart.classList.remove('active');
            screenBrb.classList.remove('active');
            screenDonation.classList.remove('active');

            btnStart.classList.remove('active-btn');
            btnBrb.classList.remove('active-btn');
            btnDonation.classList.remove('active-btn');

            if (screen === 'start') {
                screenStart.classList.add('active');
                btnStart.classList.add('active-btn');
            } else if (screen === 'brb') {
                screenBrb.classList.add('active');
                btnBrb.classList.add('active-btn');
            } else if (screen === 'donation') {
                screenDonation.classList.add('active');
                btnDonation.classList.add('active-btn');
            }
        }

        btnStart.addEventListener('click', () => setScreen('start'));
        btnBrb.addEventListener('click', () => setScreen('brb'));
        btnDonation.addEventListener('click', () => setScreen('donation'));

        // Atajos de teclado
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') setScreen('start');
            if (e.key === '2') setScreen('brb');
            if (e.key === '3') setScreen('donation');
        });

        // ----- CONTADOR REGRESIVO (5 minutos) -----
        let timeLeft = 5 * 60;
        const countdownEl = document.getElementById('countdown');

        function updateCountdown() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;

            countdownEl.textContent =
                `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            if (timeLeft > 0) {
                timeLeft--;
            } else {
                timeLeft = 5 * 60;
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        console.log('Overlay R3DFIELD visual basado en las referencias: 1 START, 2 BRB, 3 DONATION');
    </script>
</body>
</html>

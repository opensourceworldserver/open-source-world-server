<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R3DFIELD - Overlays</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===== RESET & BASE ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050505;
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        /* ===== MAIN CONTAINER ===== */
        .container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050505;
            overflow: hidden;
        }

        /* ===== VIGNETTE ===== */
        .vignette {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 70%, rgba(0,0,0,0.95) 100%);
            pointer-events: none;
            z-index: 5;
        }

        /* ===== SCANLINES ===== */
        .scanlines {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.08) 2px,
                rgba(0,0,0,0.08) 4px
            );
            pointer-events: none;
            z-index: 6;
        }

        /* ===== NOISE/GRAIN ===== */
        .noise {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0.04;
            pointer-events: none;
            z-index: 4;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
            background-size: 256px 256px;
        }

        /* ===== RED AMBIENT GLOW (background) ===== */
        .ambient-glow {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at 50% 55%, rgba(255,0,40,0.12) 0%, rgba(255,0,40,0.05) 30%, transparent 60%);
            pointer-events: none;
            z-index: 1;
            animation: ambientPulse 4s infinite alternate ease-in-out;
        }
        @keyframes ambientPulse {
            0% { opacity: 0.8; }
            100% { opacity: 1.2; }
        }

        /* ===== CHEVRON SIDE FRAMES ===== */
        .chevron-left, .chevron-right {
            position: absolute;
            top: 10%;
            width: 18%;
            height: 80%;
            z-index: 2;
            pointer-events: none;
        }
        .chevron-left { left: 0; }
        .chevron-right { right: 0; }

        .chevron-left::before {
            content: '';
            position: absolute;
            top: 15%; left: 20%;
            width: 70%; height: 35%;
            border-left: 3px solid rgba(255,0,40,0.25);
            border-bottom: 3px solid rgba(255,0,40,0.25);
            transform: skewY(-20deg);
            filter: drop-shadow(0 0 8px rgba(255,0,40,0.3));
        }
        .chevron-left::after {
            content: '';
            position: absolute;
            top: 55%; left: 30%;
            width: 60%; height: 30%;
            border-left: 2px solid rgba(255,0,40,0.15);
            border-bottom: 2px solid rgba(255,0,40,0.15);
            transform: skewY(-15deg);
        }
        .chevron-right::before {
            content: '';
            position: absolute;
            top: 15%; right: 20%;
            width: 70%; height: 35%;
            border-right: 3px solid rgba(255,0,40,0.25);
            border-bottom: 3px solid rgba(255,0,40,0.25);
            transform: skewY(20deg);
            filter: drop-shadow(0 0 8px rgba(255,0,40,0.3));
        }
        .chevron-right::after {
            content: '';
            position: absolute;
            top: 55%; right: 30%;
            width: 60%; height: 30%;
            border-right: 2px solid rgba(255,0,40,0.15);
            border-bottom: 2px solid rgba(255,0,40,0.15);
            transform: skewY(15deg);
        }

        /* ===== BACKGROUND GIANT "R" WATERMARK ===== */
        .watermark-r {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(25rem, 50vw, 50rem);
            font-weight: 900;
            color: rgba(255,0,40,0.03);
            letter-spacing: -0.05em;
            pointer-events: none;
            z-index: 1;
            user-select: none;
            line-height: 1;
        }

        /* ===== FLOOR REFLECTION ===== */
        .floor-reflection {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 30%;
            background: linear-gradient(to top, rgba(255,0,40,0.06) 0%, transparent 100%);
            pointer-events: none;
            z-index: 1;
        }
        .floor-line {
            position: absolute;
            bottom: 8%; left: 10%;
            width: 80%; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,0,40,0.2), rgba(255,0,40,0.4), rgba(255,0,40,0.2), transparent);
            pointer-events: none;
            z-index: 2;
        }

        /* ===== RED SMOKE / FOG ===== */
        .smoke {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
        }
        .smoke-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
        }
        .smoke-blob:nth-child(1) {
            width: 500px; height: 300px;
            background: radial-gradient(circle, rgba(255,0,40,0.6), transparent);
            bottom: 5%; left: 10%;
            animation: smokeFloat1 12s infinite alternate ease-in-out;
        }
        .smoke-blob:nth-child(2) {
            width: 600px; height: 350px;
            background: radial-gradient(circle, rgba(255,0,40,0.5), transparent);
            bottom: 10%; right: 5%;
            animation: smokeFloat2 15s infinite alternate ease-in-out;
        }
        .smoke-blob:nth-child(3) {
            width: 400px; height: 250px;
            background: radial-gradient(circle, rgba(255,0,40,0.4), transparent);
            bottom: 0; left: 35%;
            animation: smokeFloat3 10s infinite alternate ease-in-out;
        }
        @keyframes smokeFloat1 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, -20px) scale(1.15); }
        }
        @keyframes smokeFloat2 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-30px, -15px) scale(1.1); }
        }
        @keyframes smokeFloat3 {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(20px, -25px) scale(1.2); }
        }

        /* ===== PARTICLES ===== */
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 3;
        }
        .particle-ember {
            background: rgba(255,40,40,0.8);
            box-shadow: 0 0 4px rgba(255,0,0,0.6);
            animation: emberFloat 5s infinite ease-in-out;
        }
        .particle-dot {
            background: rgba(255,60,60,0.4);
            animation: dotFloat 8s infinite ease-in-out;
        }
        @keyframes emberFloat {
            0% { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.6; }
            100% { transform: translateY(-60px) translateX(10px) scale(0.3); opacity: 0; }
        }
        @keyframes dotFloat {
            0% { transform: translateY(0) scale(1); opacity: 0.1; }
            50% { transform: translateY(-20px) scale(1.5); opacity: 0.5; }
            100% { transform: translateY(0) scale(1); opacity: 0.1; }
        }

        /* ===== SCREEN (each overlay) ===== */
        .screen {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            transform: scale(0.97);
            transition: opacity 0.6s ease, transform 0.6s ease;
            pointer-events: none;
            z-index: 10;
        }
        .screen.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* ===== TOP INDICATOR /// ===== */
        .top-indicator {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.2rem, 2.5vw, 2rem);
            font-weight: 700;
            color: rgba(255,0,40,0.6);
            letter-spacing: 0.15rem;
            margin-bottom: 0.3em;
            text-shadow: 0 0 10px rgba(255,0,40,0.4);
        }

        /* ===== "STREAM" LABEL with flanking lines ===== */
        .stream-label {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 0.15em;
        }
        .stream-line {
            width: clamp(30px, 8vw, 80px);
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,0,40,0.5));
            position: relative;
        }
        .stream-line::after {
            content: '';
            position: absolute;
            right: -3px; top: -2px;
            width: 5px; height: 5px;
            background: rgba(255,0,40,0.7);
            border-radius: 50%;
        }
        .stream-line.right {
            background: linear-gradient(90deg, rgba(255,0,40,0.5), transparent);
        }
        .stream-line.right::after {
            right: auto; left: -3px;
        }
        .stream-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(1.2rem, 3vw, 2.2rem);
            font-weight: 700;
            letter-spacing: 0.6rem;
            color: #ccc;
            text-transform: uppercase;
        }

        /* ===== HERO TEXT (split-color) ===== */
        .hero {
            display: flex;
            align-items: baseline;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 0.05em;
        }
        .hero-word {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(3.5rem, 11vw, 9rem);
            font-weight: 700;
            font-style: italic;
            letter-spacing: 0.02em;
            line-height: 1.1;
        }
        .hero-silver {
            color: #e0e0e0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.05);
            /* Distressed/grunge feel via slight text-shadow stacking */
        }
        .hero-red {
            color: #ff003c;
            text-shadow:
                0 0 10px rgba(255,0,60,0.8),
                0 0 30px rgba(255,0,60,0.5),
                0 0 60px rgba(255,0,60,0.3),
                0 2px 4px rgba(0,0,0,0.8);
            animation: redPulse 2.5s infinite alternate ease-in-out;
        }
        @keyframes redPulse {
            0% {
                text-shadow:
                    0 0 10px rgba(255,0,60,0.8),
                    0 0 30px rgba(255,0,60,0.5),
                    0 0 60px rgba(255,0,60,0.3),
                    0 2px 4px rgba(0,0,0,0.8);
            }
            100% {
                text-shadow:
                    0 0 15px rgba(255,0,60,1),
                    0 0 40px rgba(255,0,60,0.7),
                    0 0 80px rgba(255,0,60,0.4),
                    0 0 120px rgba(255,0,60,0.15),
                    0 2px 4px rgba(0,0,0,0.8);
            }
        }
        .hero-dots {
            color: #ff003c;
            font-style: normal;
            animation: dotsBlink 1.5s infinite steps(1);
        }
        @keyframes dotsBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.5; }
        }

        /* ===== SUB-HEADER with flanking elements ===== */
        .sub-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0.6em 0 1.2em 0;
        }
        .sub-line {
            width: clamp(20px, 6vw, 60px);
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,0,40,0.4));
        }
        .sub-line.right {
            background: linear-gradient(90deg, rgba(255,0,40,0.4), transparent);
        }
        .sub-dot {
            width: 4px; height: 4px;
            background: rgba(255,0,40,0.7);
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(255,0,40,0.5);
        }
        .sub-text {
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(0.9rem, 2.2vw, 1.6rem);
            font-weight: 600;
            letter-spacing: 0.35rem;
            color: #999;
            text-transform: uppercase;
        }

        /* ===== R3DFIELD BRAND (split color) ===== */
        .brand {
            display: flex;
            align-items: baseline;
            justify-content: center;
            margin-bottom: 0.4em;
        }
        .brand-r3d {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 6vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 0.15rem;
            color: #ff003c;
            text-shadow:
                0 0 15px rgba(255,0,60,0.8),
                0 0 40px rgba(255,0,60,0.4);
            animation: brandRedPulse 3s infinite alternate ease-in-out;
        }
        @keyframes brandRedPulse {
            0% { text-shadow: 0 0 15px rgba(255,0,60,0.8), 0 0 40px rgba(255,0,60,0.4); }
            100% { text-shadow: 0 0 20px rgba(255,0,60,1), 0 0 50px rgba(255,0,60,0.6), 0 0 80px rgba(255,0,60,0.2); }
        }
        .brand-field {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 6vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 0.15rem;
            color: #e8e8e8;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }

        /* ===== COUNTDOWN TIMER ===== */
        .countdown-container {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 0.3em;
        }
        .countdown-bracket {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.5rem, 4vw, 3rem);
            font-weight: 700;
            color: rgba(255,0,40,0.5);
        }
        .countdown {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.8rem, 4.5vw, 3.2rem);
            font-weight: 700;
            color: #ff003c;
            text-shadow:
                0 0 15px rgba(255,0,60,0.6),
                0 0 30px rgba(255,0,60,0.3);
            letter-spacing: 0.15rem;
            background: rgba(255,0,40,0.06);
            padding: 0.15em 0.6em;
            border: 1px solid rgba(255,0,40,0.15);
            border-radius: 4px;
        }
        /* Progress bar under countdown */
        .countdown-bar {
            width: clamp(120px, 20vw, 250px);
            height: 2px;
            background: rgba(255,0,40,0.15);
            margin-top: 6px;
            border-radius: 1px;
            overflow: hidden;
            position: relative;
        }
        .countdown-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, rgba(255,0,40,0.8), rgba(255,0,40,0.4));
            border-radius: 1px;
            transition: width 1s linear;
            box-shadow: 0 0 6px rgba(255,0,40,0.5);
        }

        /* ===== FOOTER BAR (social handles) ===== */
        .footer-bar {
            position: absolute;
            bottom: 4%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 0;
            background: rgba(8,8,8,0.85);
            border: 1px solid rgba(255,0,40,0.2);
            padding: 8px 0;
            z-index: 10;
            /* Chamfered/clip corners for sci-fi feel */
            clip-path: polygon(
                12px 0, calc(100% - 12px) 0,
                100% 12px, 100% calc(100% - 12px),
                calc(100% - 12px) 100%, 12px 100%,
                0 calc(100% - 12px), 0 12px
            );
            backdrop-filter: blur(4px);
        }
        .footer-section {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 20px;
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(0.85rem, 1.5vw, 1.15rem);
            font-weight: 600;
            color: #ccc;
            letter-spacing: 0.05rem;
        }
        .footer-divider {
            width: 1px;
            height: 20px;
            background: rgba(255,0,40,0.25);
        }
        .footer-icon {
            width: 18px; height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .footer-icon svg {
            width: 100%; height: 100%;
        }
        .footer-handle {
            color: #aaa;
            transition: color 0.3s;
        }
        .footer-section:hover .footer-handle {
            color: #ff003c;
        }
        /* Corner HUD brackets on footer */
        .footer-bar::before,
        .footer-bar::after {
            content: '';
            position: absolute;
            width: 10px; height: 10px;
            border-color: rgba(255,0,40,0.4);
            border-style: solid;
        }
        .footer-bar::before {
            top: -1px; left: -1px;
            border-width: 2px 0 0 2px;
        }
        .footer-bar::after {
            bottom: -1px; right: -1px;
            border-width: 0 2px 2px 0;
        }

        /* ===== HUD CORNER ACCENTS (main screen) ===== */
        .hud-corner {
            position: absolute;
            width: 40px; height: 40px;
            z-index: 8;
            pointer-events: none;
        }
        .hud-corner::before,
        .hud-corner::after {
            content: '';
            position: absolute;
            background: rgba(255,0,40,0.3);
        }
        .hud-tl { top: 3%; left: 3%; }
        .hud-tl::before { top: 0; left: 0; width: 30px; height: 2px; }
        .hud-tl::after { top: 0; left: 0; width: 2px; height: 30px; }

        .hud-tr { top: 3%; right: 3%; }
        .hud-tr::before { top: 0; right: 0; width: 30px; height: 2px; }
        .hud-tr::after { top: 0; right: 0; width: 2px; height: 30px; }

        .hud-bl { bottom: 12%; left: 3%; }
        .hud-bl::before { bottom: 0; left: 0; width: 30px; height: 2px; }
        .hud-bl::after { bottom: 0; left: 0; width: 2px; height: 30px; }

        .hud-br { bottom: 12%; right: 3%; }
        .hud-br::before { bottom: 0; right: 0; width: 30px; height: 2px; }
        .hud-br::after { bottom: 0; right: 0; width: 2px; height: 30px; }

        /* ===== DIAGONAL RED STREAKS ===== */
        .streak {
            position: absolute;
            pointer-events: none;
            z-index: 2;
        }
        .streak-1 {
            top: 0; left: -5%;
            width: 50%; height: 100%;
            background: linear-gradient(
                135deg,
                transparent 40%,
                rgba(255,0,40,0.04) 45%,
                rgba(255,0,40,0.08) 48%,
                rgba(255,0,40,0.04) 51%,
                transparent 56%
            );
        }
        .streak-2 {
            top: 0; right: -5%;
            width: 50%; height: 100%;
            background: linear-gradient(
                225deg,
                transparent 40%,
                rgba(255,0,40,0.04) 45%,
                rgba(255,0,40,0.06) 48%,
                rgba(255,0,40,0.04) 51%,
                transparent 56%
            );
        }

        /* ===== CONTROLS (test) ===== */
        .controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            display: flex;
            gap: 15px;
            background: rgba(0,0,0,0.85);
            padding: 10px 22px;
            border-radius: 4px;
            border: 1px solid rgba(255,0,40,0.2);
            backdrop-filter: blur(8px);
            clip-path: polygon(
                6px 0, calc(100% - 6px) 0,
                100% 6px, 100% calc(100% - 6px),
                calc(100% - 6px) 100%, 6px 100%,
                0 calc(100% - 6px), 0 6px
            );
        }
        .controls button {
            background: transparent;
            border: 1px solid rgba(255,0,40,0.5);
            color: #ff003c;
            padding: 6px 18px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
        }
        .controls button:hover {
            background: rgba(255,0,40,0.15);
            border-color: #ff003c;
        }
        .controls button.active-btn {
            background: rgba(255,0,40,0.2);
            border-color: #ff003c;
            box-shadow: 0 0 10px rgba(255,0,40,0.3);
        }
        .controls .hint {
            color: #555;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            margin-left: 8px;
            border-left: 1px solid rgba(255,0,40,0.15);
            padding-left: 12px;
            font-family: 'Rajdhani', sans-serif;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .hero-word { font-size: 2.8rem; }
            .brand-r3d, .brand-field { font-size: 2rem; }
            .stream-text { font-size: 1rem; letter-spacing: 0.3rem; }
            .sub-text { font-size: 0.75rem; letter-spacing: 0.2rem; }
            .top-indicator { font-size: 1rem; }
            .footer-bar { clip-path: polygon(6px 0, calc(100% - 6px) 0, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0 calc(100% - 6px), 0 6px); }
            .footer-section { padding: 0 10px; font-size: 0.75rem; }
            .controls { padding: 8px 14px; gap: 8px; }
            .controls button { font-size: 0.7rem; padding: 4px 10px; }
            .hint { display: none !important; }
            .chevron-left, .chevron-right { display: none; }
            .hud-corner { display: none; }
        }
    </style>
</head>
<body>
    <div class="container" id="container">

        <!-- ===== BACKGROUND LAYERS ===== -->
        <div class="ambient-glow"></div>
        <div class="watermark-r">R</div>
        <div class="streak streak-1"></div>
        <div class="streak streak-2"></div>
        <div class="smoke">
            <div class="smoke-blob"></div>
            <div class="smoke-blob"></div>
            <div class="smoke-blob"></div>
        </div>
        <div id="particles"></div>
        <div class="floor-reflection"></div>
        <div class="floor-line"></div>

        <!-- ===== CHEVRON FRAMES ===== -->
        <div class="chevron-left"></div>
        <div class="chevron-right"></div>

        <!-- ===== HUD CORNER ACCENTS ===== -->
        <div class="hud-corner hud-tl"></div>
        <div class="hud-corner hud-tr"></div>
        <div class="hud-corner hud-bl"></div>
        <div class="hud-corner hud-br"></div>

        <!-- ===== OVERLAYS (scanlines & vignette on top) ===== -->
        <div class="scanlines"></div>
        <div class="vignette"></div>
        <div class="noise"></div>

        <!-- ===== SCREEN 1: STARTING SOON ===== -->
        <div class="screen active" id="screen-start">
            <div class="top-indicator">///</div>
            <div class="stream-label">
                <div class="stream-line"></div>
                <div class="stream-text">STREAM</div>
                <div class="stream-line right"></div>
            </div>
            <div class="hero">
                <span class="hero-word hero-silver">STARTING&nbsp;</span>
                <span class="hero-word hero-red">SOON</span>
                <span class="hero-word hero-red hero-dots">...</span>
            </div>
            <div class="sub-header">
                <div class="sub-line"></div>
                <div class="sub-dot"></div>
                <div class="sub-text">The Stream Will Begin Shortly</div>
                <div class="sub-dot"></div>
                <div class="sub-line right"></div>
            </div>
            <div class="brand">
                <span class="brand-r3d">R3D</span>
                <span class="brand-field">FIELD</span>
            </div>
            <div class="countdown-container">
                <span class="countdown-bracket">[</span>
                <div class="countdown" id="countdown">05:00</div>
                <span class="countdown-bracket">]</span>
            </div>
            <div class="countdown-bar">
                <div class="countdown-bar-fill" id="countdown-bar-fill" style="width: 100%"></div>
            </div>
        </div>

        <!-- ===== SCREEN 2: BE RIGHT BACK ===== -->
        <div class="screen" id="screen-brb">
            <div class="top-indicator">///</div>
            <div class="stream-label">
                <div class="stream-line"></div>
                <div class="stream-text">Stream</div>
                <div class="stream-line right"></div>
            </div>
            <div class="hero">
                <span class="hero-word hero-silver">BE&nbsp;</span>
                <span class="hero-word hero-red">RIGHT&nbsp;</span>
                <span class="hero-word hero-silver">BACK</span>
            </div>
            <div class="sub-header">
                <div class="sub-line"></div>
                <div class="sub-dot"></div>
                <div class="sub-text">Taking A Short Break</div>
                <div class="sub-dot"></div>
                <div class="sub-line right"></div>
            </div>
            <div class="brand">
                <span class="brand-r3d">R3D</span>
                <span class="brand-field">FIELD</span>
            </div>
        </div>

        <!-- ===== FOOTER BAR ===== -->
        <div class="footer-bar">
            <div class="footer-section">
                <div class="footer-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="2" y="4" width="20" height="16" rx="3" stroke="#ff003c" stroke-width="1.5"/>
                        <polygon points="10,8 10,16 16,12" fill="#ff003c"/>
                    </svg>
                </div>
                <span class="footer-handle">R3dfield</span>
            </div>
            <div class="footer-divider"></div>
            <div class="footer-section">
                <div class="footer-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 3.878H5.123z" fill="#ccc"/>
                    </svg>
                </div>
                <span class="footer-handle">R3dfield1</span>
            </div>
            <div class="footer-divider"></div>
            <div class="footer-section">
                <div class="footer-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.44.77-.68 1.15a18.27 18.27 0 0 0-4.924 0c-.244-.37-.47-.77-.68-1.15a.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 4.91 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.077a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.733 2.87.078.078 0 0 0 .084-.028c.276-.376.528-.77.76-1.165a.07.07 0 0 0-.041-.064 13.105 13.105 0 0 1-1.604-.637.07.07 0 0 1-.015-.096c.108-.127.216-.254.32-.385a.07.07 0 0 1 .075-.02c3.38 1.275 7.054 1.275 10.39 0a.07.07 0 0 1 .076.02c.104.13.212.258.32.385a.07.07 0 0 1-.016.096 12.97 12.97 0 0 1-1.605.637.07.07 0 0 0-.04.064c.232.396.484.79.76 1.165a.078.078 0 0 0 .084.028 19.839 19.839 0 0 0 5.733-2.87.07.07 0 0 0 .032-.057c.546-4.645-.098-9.22-3.847-13.678a.07.07 0 0 0-.033-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z" fill="#ccc"/>
                    </svg>
                </div>
                <span class="footer-handle">r3dfield</span>
            </div>
        </div>
    </div>

    <!-- ===== TEST CONTROLS ===== -->
    <div class="controls">
        <button id="btn-start" class="active-btn">&#9654; START</button>
        <button id="btn-brb">&#9208; BRB</button>
        <div class="hint">Tecla 1 &middot; 2</div>
    </div>

    <script>
        // ===== PARTICLES =====
        (function createParticles() {
            const container = document.getElementById('particles');
            const emberCount = 30;
            const dotCount = 40;

            // Embers (bright, small, rising)
            for (let i = 0; i < emberCount; i++) {
                const p = document.createElement('div');
                p.className = 'particle particle-ember';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = (40 + Math.random() * 60) + '%';
                p.style.animationDelay = (Math.random() * 5) + 's';
                p.style.animationDuration = (3 + Math.random() * 4) + 's';
                const size = (1 + Math.random() * 2) + 'px';
                p.style.width = size;
                p.style.height = size;
                container.appendChild(p);
            }

            // Dots (dim, larger, floating)
            for (let i = 0; i < dotCount; i++) {
                const p = document.createElement('div');
                p.className = 'particle particle-dot';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDelay = (Math.random() * 8) + 's';
                p.style.animationDuration = (5 + Math.random() * 6) + 's';
                const size = (1 + Math.random() * 3) + 'px';
                p.style.width = size;
                p.style.height = size;
                container.appendChild(p);
            }
        })();

        // ===== SCREEN SWITCHING =====
        const screenStart = document.getElementById('screen-start');
        const screenBrb = document.getElementById('screen-brb');
        const btnStart = document.getElementById('btn-start');
        const btnBrb = document.getElementById('btn-brb');

        function setScreen(screen) {
            screenStart.classList.remove('active');
            screenBrb.classList.remove('active');
            btnStart.classList.remove('active-btn');
            btnBrb.classList.remove('active-btn');

            if (screen === 'start') {
                screenStart.classList.add('active');
                btnStart.classList.add('active-btn');
            } else {
                screenBrb.classList.add('active');
                btnBrb.classList.add('active-btn');
            }
        }

        btnStart.addEventListener('click', () => setScreen('start'));
        btnBrb.addEventListener('click', () => setScreen('brb'));

        document.addEventListener('keydown', (e) => {
            if (e.key === '1') setScreen('start');
            if (e.key === '2') setScreen('brb');
        });

        // ===== COUNTDOWN (5 minutes) =====
        const TOTAL_TIME = 5 * 60;
        let timeLeft = TOTAL_TIME;
        const countdownEl = document.getElementById('countdown');
        const countdownBarFill = document.getElementById('countdown-bar-fill');

        function updateCountdown() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            countdownEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            // Update progress bar
            const progress = (timeLeft / TOTAL_TIME) * 100;
            countdownBarFill.style.width = progress + '%';

            if (timeLeft > 0) {
                timeLeft--;
            } else {
                timeLeft = TOTAL_TIME; // Reset for demo
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        console.log('R3DFIELD Overlay listo. Teclas 1 y 2 para cambiar pantalla.');
    </script>
</body>
